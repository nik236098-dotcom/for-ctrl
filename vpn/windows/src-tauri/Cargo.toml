[package]
name = "ruvpn-windows"
version = "0.1.0"
edition = "2021"
description = "Ru VPN — клиент WireGuard для Windows, тот же дизайн, что в Android-приложении"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls вместо системного OpenSSL — меньше сюрпризов при сборке на чистом
# windows-latest runner в CI.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "process"] }
base64 = "0.22"
# Чтение буфера обмена для кнопки «Вставить из буфера» и автоподстановки —
# то же самое, что ClipboardManager на Android.
arboard = "3"
# Официальный WireGuard сам открывает своё окно менеджера один раз после
# установки (это его собственное поведение, не наш вызов) — пробуем
# закрыть это окно за него, см. close_wireguard_manager_window() в main.rs.
# GetIfTable2/MIB_IF_TABLE2 (счётчики трафика тунеля, main.rs) в этой версии
# крейта дополнительно требуют feature Win32_NetworkManagement_Ndis — без
# неё эти два имени физически не собраны в крейт (не просто "не включены",
# а "configured out", видно в исходниках windows-rs).
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }

# Приложение управляет системным сервисом туннеля (wireguard.exe
# /installtunnelservice) — это требует прав администратора, поэтому всё
# приложение целиком просит их через манифест (windows/app.manifest),
# один раз, при запуске.
