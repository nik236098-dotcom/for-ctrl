[package]
name = "ruvpn-windows"
version = "0.1.0"
edition = "2021"
description = "Ru VPN — клиент WireGuard для Windows, тот же дизайн, что в Android-приложении"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls вместо системного OpenSSL — меньше сюрпризов при сборке на чистом
# windows-latest runner в CI.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "process"] }
base64 = "0.22"
# Чтение буфера обмена для кнопки «Вставить из буфера» и автоподстановки —
# то же самое, что ClipboardManager на Android.
arboard = "3"

# Приложение управляет системным сервисом туннеля (wireguard.exe
# /installtunnelservice) — это требует прав администратора, поэтому всё
# приложение целиком просит их через манифест (windows/app.manifest),
# один раз, при запуске.
