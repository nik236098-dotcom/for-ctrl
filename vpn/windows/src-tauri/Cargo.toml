[package]
name = "ruvpn-windows"
version = "0.3.0"
edition = "2021"
description = "Ru VPN — клиент WireGuard для Windows со встроенным драйвером WireGuardNT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-single-instance = "2"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls вместо системного OpenSSL — меньше сюрпризов при сборке на чистом
# windows-latest runner в CI.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "process", "sync"] }
base64 = "0.22"
ipnet = "2"
# Ключ WireGuard этого компьютера создаётся прямо здесь (provision.rs).
x25519-dalek = "2"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
# Обёртка над wireguard.dll (WireGuardNT — драйвер официального WireGuard,
# который можно встраивать в своё приложение). Сам wireguard.dll кладётся в
# установщик при сборке, см. .github/workflows/build-vpn-windows.yml.
wireguard-nt = "0.5"
# Адреса, маршруты, метрика и DNS адаптера туннеля (net.rs) — та же версия,
# что использует wireguard-nt.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }
# SetInterfaceDnsSettings есть только в Windows 10 2004+, ищем её при вызове.
libloading = "0.8"

# Создание сетевого адаптера и установка драйвера требуют прав
# администратора — всё приложение просит их через манифест
# (windows/app.manifest), один раз, при запуске.
