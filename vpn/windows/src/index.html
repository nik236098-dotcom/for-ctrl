<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Ru VPN</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <img class="bg" src="assets/space_bg.png" alt="" />

  <div class="screen">
    <h1 class="title">Ru VPN</h1>

    <button id="ipRow" class="ip-row">
      <img class="globe" src="assets/ic_globe.png" alt="" />
      <span id="textIp">Ваш ip: …</span>
    </button>
    <div id="textChangeServerHint" class="change-server-hint" hidden>Нажмите, чтобы сменить</div>

    <div class="spacer"></div>

    <div class="power-wrap">
      <img id="imagePowerOff" class="power power-off" src="assets/power_off.png" alt="" />
      <img id="imagePowerOn" class="power power-on" src="assets/power_on.png" alt="" />
      <button id="buttonToggle" class="power-hit" aria-label="Кнопка соединения"></button>
    </div>

    <div id="textStatus" class="status">Впн выключен</div>
    <div id="progress" class="spinner" hidden></div>

    <div class="traffic-row">
      <div class="traffic-col">
        <span class="traffic-label">Получено</span>
        <span id="textReceived" class="traffic-value">0 КБ</span>
      </div>
      <div class="traffic-col">
        <span class="traffic-label">Отправлено</span>
        <span id="textSent" class="traffic-value">0 КБ</span>
      </div>
    </div>

    <div class="spacer"></div>

    <button id="buttonKey" class="flat-button">Вставить ключ</button>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="dialog-card">
      <div class="dialog-title">Ключ доступа</div>
      <div class="dialog-help">Вставьте ключ, который прислал бот</div>
      <textarea id="inputKey" class="key-input" placeholder="Ab3xK9pQ" rows="3"></textarea>
      <button id="buttonPasteClipboard" class="flat-button">Вставить из буфера</button>
      <div class="dialog-actions">
        <button id="textCancel" class="text-action cancel">Отмена</button>
        <button id="textDone" class="text-action done">Готово</button>
      </div>
    </div>
  </div>

  <div id="overlayCountry" class="overlay" hidden>
    <div class="dialog-card">
      <div class="dialog-title">Сервер</div>
      <div class="dialog-help">Откуда будет ваш ip</div>
      <button id="buttonCountryRu" class="flat-button country-button">Россия 🇷🇺</button>
      <button id="buttonCountryUs" class="flat-button country-button">США 🇺🇸</button>
      <button id="textCountryCancel" class="country-cancel">Отмена</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="main.js"></script>
</body>
</html>
